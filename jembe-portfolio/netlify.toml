[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22+
  NODE_VERSION = "22"
  # These are public browser keys by design; stop Netlify's secret scanner from failing the build on them
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PUBLISHABLE_KEY"

# Vite/React SPA fallback so direct routes work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
